[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdf-cli"
dynamic = ["version"]
description = "Modern MDF Connect client with CLI, Python API, and Claude skill integration."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Materials Data Facility" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.0",
  "globus-sdk>=3.0,<4",
  "typer[all]>=0.9.0",
  "rich>=13.0",
  "pyyaml>=6.0",
  "httpx>=0.24.0",
  "nameparser>=1.1.0",
]

[project.optional-dependencies]
extractors = [
  "pypdf>=3.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.scripts]
mdf = "mdf.cli.main:app"

[project.urls]
Homepage = "https://materialsdatafacility.org"
Repository = "https://github.com/materials-data-facility/mdf-cli"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
mdf = ["skills/**/*.md", "skill/*.md"]

[tool.setuptools.dynamic]
version = {attr = "mdf.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
